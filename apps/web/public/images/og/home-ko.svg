<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#fff"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif"><g transform="translate(72 64)"><rect width="56" height="56" rx="8" fill="#fff" stroke="#1b2128" stroke-width="2"/><path d="M10 13h36v7H10z" fill="#dce7f9" stroke="#1b2128"/><path d="M10 26h27v7H10z" fill="#ddf1e2" stroke="#1b2128"/><path d="M10 39h18v6H10z" fill="#f9edc8" stroke="#1b2128"/></g><text x="150" y="105" font-size="36" fill="#1b2128" font-family="Arial, sans-serif">decod.ing</text><text x="855" y="101" font-size="20" fill="#387346" font-family="Arial, Apple SD Gothic Neo, sans-serif">이 기기 안에서</text><text x="72" y="218" font-size="52" fill="#1b2128" font-family="Arial, Apple SD Gothic Neo, sans-serif">모르는 값을</text><text x="72" y="280" font-size="52" fill="#1b2128" font-family="Arial, Apple SD Gothic Neo, sans-serif">붙여넣으세요</text><text x="72" y="330" font-size="25" fill="#606b78" font-family="Arial, Apple SD Gothic Neo, sans-serif">답부터 보고, 겹마다 살펴봐요.</text><rect x="72" y="378" width="1056" height="172" rx="8" fill="#f6f8fa" stroke="#d8dee6"/><text x="100" y="416" font-size="24" fill="#606b78" font-family="monospace">7JWI64WV7ZWY7IS47JqUIOyEuOqzhA==</text><text x="100" y="463" font-size="27" fill="#1b2128" font-family="Arial, Apple SD Gothic Neo, sans-serif">Base64로 싼 값이에요. 한 겹 풀었어요.</text><rect x="96" y="482" width="1008" height="48" rx="4" fill="#ddf1e2"/><text x="112" y="516" font-size="30" fill="#1b2128" font-family="Arial, Apple SD Gothic Neo, sans-serif">안녕하세요 세계</text><text x="72" y="598" font-size="22" fill="#606b78" font-family="Arial, Apple SD Gothic Neo, sans-serif">계정 없이. 입력값 업로드 없이.</text></g></svg>