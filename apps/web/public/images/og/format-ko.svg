<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#fff"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif"><g transform="translate(72 64)"><rect width="56" height="56" rx="8" fill="#fff" stroke="#1b2128" stroke-width="2"/><path d="M10 13h36v7H10z" fill="#dce7f9" stroke="#1b2128"/><path d="M10 26h27v7H10z" fill="#ddf1e2" stroke="#1b2128"/><path d="M10 39h18v6H10z" fill="#f9edc8" stroke="#1b2128"/></g><text x="150" y="105" font-size="36" fill="#1b2128" font-family="Arial, sans-serif">decod.ing</text><text x="855" y="101" font-size="20" fill="#387346" font-family="Arial, Apple SD Gothic Neo, sans-serif">이 기기 안에서</text><text x="72" y="218" font-size="52" fill="#1b2128" font-family="Arial, Apple SD Gothic Neo, sans-serif">어떤 방식인지</text><text x="72" y="280" font-size="52" fill="#1b2128" font-family="Arial, Apple SD Gothic Neo, sans-serif">까닭까지 보세요</text><text x="72" y="330" font-size="25" fill="#606b78" font-family="Arial, Apple SD Gothic Neo, sans-serif">형식의 근거와 안쪽 겹을 살펴보세요.</text><rect x="72" y="378" width="1056" height="48" fill="#dce7f9"/><text x="96" y="411" font-size="26" fill="#1b2128" font-family="Arial, Apple SD Gothic Neo, sans-serif">Base64 → 바이트</text><rect x="112" y="440" width="920" height="48" fill="#ddf1e2"/><text x="136" y="473" font-size="26" fill="#1b2128" font-family="Arial, Apple SD Gothic Neo, sans-serif">JSON → 자료</text><rect x="152" y="502" width="660" height="48" fill="#f9edc8"/><text x="176" y="535" font-size="26" fill="#1b2128" font-family="monospace">{"ok":true}</text><text x="72" y="598" font-size="22" fill="#606b78" font-family="Arial, Apple SD Gothic Neo, sans-serif">계정 없이. 입력값 업로드 없이.</text></g></svg>