<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A안 · 붙여넣으면 한 문장으로 답한다</title><link rel="stylesheet" href="proto.css">
<div class="app">
  <header class="top"><span class="brand">decod<i>.ing</i></span><a class="local" href="common.html?s=proof" id="local"></a></header>
  <main class="pad">
    <h1>이게 뭔지 모르겠다면<br>여기에 붙여넣으세요</h1>
    <p class="lede">알 수 없는 글자, 깨진 한글, 긴 주소, QR 사진. 무엇인지 알려 드리고 끝까지 풀어 드려요.</p>
    <div class="box">
      <textarea id="in" rows="3" placeholder="여기를 눌러 붙여넣기" aria-label="풀어 볼 값"></textarea>
      <div class="ins"><button class="btn pri" id="paste"></button><button class="btn" id="photo"></button><button class="btn" id="file"></button></div>
    </div>
    <div id="qrbox" hidden></div>
    <div id="out"></div>
    <h2 id="exh">이런 걸 들고 오셨나요? 눌러서 미리 보기</h2>
    <div class="chips" id="chips" role="group" aria-labelledby="exh"></div>
    <div id="recent"></div>
  </main>
</div>
<div id="nav"></div>
<script src="proto.js"></script>
<script>
var P=Proto,$=function(i){return document.getElementById(i)},S=P.samples,inp=$('in'),out=$('out');
$('local').innerHTML=P.icon('shield')+'내 기기 안에서만';
$('paste').innerHTML=P.icon('paste')+'붙여넣기';$('photo').innerHTML=P.icon('camera')+'사진·QR';$('file').innerHTML=P.icon('file')+'파일';
$('nav').innerHTML=P.nav('풀기');
$('chips').innerHTML=Object.keys(S).map(function(k){return '<button class="chip" data-k="'+k+'" aria-pressed="false">'+P.icon(S[k].icon)+S[k].label+'</button>'}).join('');
var QR='<svg viewBox="0 0 21 21" shape-rendering="crispEdges"><rect width="21" height="21" fill="#fff"/><path fill="#1b2128" d="M0 0h7v7H0zM14 0h7v7h-7zM0 14h7v7H0zM9 1h1v2H9zM11 2h2v1h-2zM8 5h3v1H8zM9 8h2v2H9zM12 8h1v3h-1zM14 9h3v1h-3zM18 8h3v2h-3zM1 9h3v1H1zM5 8h2v2H5zM8 12h2v1H8zM11 12h1v3h-1zM13 12h2v2h-2zM16 11h2v2h-2zM19 12h2v1h-2zM8 15h2v2H8zM13 16h3v1h-3zM17 15h1v3h-1zM19 15h2v2h-2zM9 18h3v1H9zM13 18h2v3h-2zM16 19h5v2h-5z"/><path fill="#fff" d="M1 1h5v5H1zM15 1h5v5h-5zM1 15h5v5H1z"/><path fill="#1b2128" d="M2 2h3v3H2zM16 2h3v3h-3zM2 16h3v3H2z"/></svg>';
function run(v,k){
  inp.value=v;
  $('qrbox').hidden=!(k&&S[k].qr);
  if(k&&S[k].qr)$('qrbox').innerHTML='<div class="qr">'+QR+'<div><b>사진에서 QR을 읽었어요</b><p class="note">찍으면 열릴 주소를 열지 않고 먼저 보여 드려요.</p></div></div>';
  if(!v.trim()){out.innerHTML='';return}
  out.innerHTML=P.renderAnswer(P.decode(v));P.wireAnswer(out);
  document.querySelectorAll('.chip').forEach(function(c){c.setAttribute('aria-pressed',String(c.dataset.k===k))});
  var a=out.querySelector('.ans');if(a&&a.scrollIntoView)a.scrollIntoView({block:'start',behavior:'smooth'});
}
$('chips').addEventListener('click',function(e){var c=e.target.closest('.chip');if(c)run(S[c.dataset.k].value,c.dataset.k)});
inp.addEventListener('input',function(){run(inp.value)});
$('paste').addEventListener('click',function(){try{navigator.clipboard.readText().then(function(t){run(t)},function(){inp.focus()})}catch(e){inp.focus()}});
$('photo').addEventListener('click',function(){run(S.qr.value,'qr')});
$('file').addEventListener('click',function(){run(S.nested.value,'nested')});
var q=new URLSearchParams(location.search).get('v');
if(q==='new'){ }
else if(q&&S[q])run(S[q].value,q);
else if(q==='returning'){$('recent').innerHTML='<h2>이 기기에 넣어 둔 것</h2><div class="card" style="padding:4px 14px"><a class="row" href="common.html?s=saved">'+P.icon('key')+'<span>스테이징 로그인 토큰<small>어제 · 로그인 토큰 · 값은 가려 둠</small></span>'+P.icon('chev')+'</a><a class="row" href="common.html?s=saved" style="border:0">'+P.icon('link')+'<span>이벤트 문자 주소<small>3일 전 · 거쳐 가는 주소</small></span>'+P.icon('chev')+'</a></div>'}
else run(S.broken.value,'broken');
</script></html>
