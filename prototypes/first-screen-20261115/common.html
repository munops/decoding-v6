<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>이어지는 화면</title><link rel="stylesheet" href="proto.css">
<div class="app"><header class="top"><a class="back" href="option-a.html" id="back"></a><a class="local" href="common.html?s=proof" id="local"></a></header><main class="pad" id="m"></main></div>
<div id="nav"></div>
<script src="proto.js"></script>
<script>
var P=Proto,$=function(i){return document.getElementById(i)},s=new URLSearchParams(location.search).get('s')||'tool',m=$('m'),I=P.icon;
$('back').innerHTML=I('chev')+'돌아가기';$('local').innerHTML=I('shield')+'내 기기 안에서만';
var navOf={tool:'도구',saved:'넣어 둔 것',more:'더보기'};$('nav').innerHTML=P.nav(navOf[s]||'풀기');
var V={
tool:function(){
  m.innerHTML='<h1>Base64 풀기·싸기</h1><p class="lede">글자를 Base64로 싸거나, Base64를 글자로 풉니다. 한글도 글자로 나와요.</p><div class="seg" role="group" aria-label="방향"><button aria-pressed="true" data-d="de">풀기</button><button aria-pressed="false" data-d="en">싸기</button></div><div class="box"><textarea id="ti" rows="3" aria-label="넣을 값">7JWI64WV7ZWY7IS47JqUIOyEuOqzhA==</textarea><div class="ins"><button class="btn pri" id="tp">'+I('paste')+'붙여넣기</button><button class="btn" id="tc">지우기</button></div></div><div class="final"><div class="fh"><span>결과 · 치는 대로 바로 바뀌어요</span><button class="mini" id="cp">'+I('copy')+'복사</button></div><pre id="to"></pre></div><div class="acts"><a class="act" href="option-a.html?v=nested">'+I('layers')+'이 결과를 더 풀기</a><a class="act" href="common.html?s=send">'+I('send')+'건네기</a></div><h2>이럴 때 써요</h2><p class="note">메일 첨부, 주소 안 값, 설정 파일의 비밀 값처럼 글자만 지나갈 수 있는 길에 자료를 실을 때 Base64로 싸요. 끝이 = 나 == 로 끝나는 영문·숫자 덩어리면 Base64일 때가 많아요. Base64는 잠금이 아니에요. 누구나 풀 수 있어요.</p><h2>같이 쓰는 도구</h2><div class="card" style="padding:4px 14px"><a class="row" href="#">'+I('link')+'<span>주소 글자 풀기</span>'+I('chev')+'</a><a class="row" href="#">'+I('img')+'<span>Base64 그림 보기</span>'+I('chev')+'</a><a class="row" href="#" style="border:0">'+I('key')+'<span>로그인 토큰 보기</span>'+I('chev')+'</a></div>';
  var d='de';function go(){var v=$('ti').value.trim(),o='';try{if(d==='de'){var b=atob(v.replace(/-/g,'+').replace(/_/g,'/'));o=new TextDecoder().decode(Uint8Array.from(b,function(c){return c.charCodeAt(0)}))}else{var by=new TextEncoder().encode(v),t='';by.forEach(function(x){t+=String.fromCharCode(x)});o=btoa(t)}}catch(e){o=v?'Base64가 아닌 글자가 섞여 있어요. 값을 다시 확인해 주세요.':''}$('to').textContent=o}
  m.querySelectorAll('.seg button').forEach(function(b){b.addEventListener('click',function(){d=b.dataset.d;m.querySelectorAll('.seg button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))});$('ti').value=d==='de'?'7JWI64WV7ZWY7IS47JqUIOyEuOqzhA==':'안녕하세요 세계';go()})});
  $('ti').addEventListener('input',go);$('tc').addEventListener('click',function(){$('ti').value='';go()});$('tp').addEventListener('click',function(){try{navigator.clipboard.readText().then(function(t){$('ti').value=t;go()},function(){})}catch(e){}});
  $('cp').addEventListener('click',function(){try{navigator.clipboard.writeText($('to').textContent)}catch(e){}$('cp').innerHTML=I('check')+'복사했어요'});go();
},
saved:function(){
  m.innerHTML='<h1>넣어 둔 것</h1><p class="lede">이 기기에만 있어요. 내가 누른 것만 들어가고, 정한 날이 지나면 스스로 지워져요.</p><div class="box" style="flex-direction:row;align-items:center">'+I('search')+'<input type="search" placeholder="이름·종류로 찾기" aria-label="넣어 둔 것 찾기"></div><div class="card" style="padding:4px 14px">'+
  [['key','스테이징 로그인 토큰','어제 · 로그인 토큰 · 7일 뒤 지워짐','값 가림','g'],['link','이벤트 문자 주소','3일 전 · 거쳐 가는 주소 · 계속 둠','값 포함','w'],['type','거래처 메일 제목','지난주 · 깨진 한글 · 계속 둠','값 포함','w'],['layers','주문 알림 자료','지난주 · 3겹 · 24시간 뒤 지워짐','값 가림','g']].map(function(r,i){return '<a class="row" href="option-a.html?v='+['token','link','broken','nested'][i]+'"'+(i===3?' style="border:0"':'')+'>'+I(r[0])+'<span>'+r[1]+' <i class="tag '+r[4]+'" style="font-style:normal">'+r[3]+'</i><small>'+r[2]+'</small></span>'+I('chev')+'</a>'}).join('')+'</div><h2>넣어 둘 때 고르는 것</h2><div class="card"><div class="seg" role="group" aria-label="무엇을 넣어 둘지"><button aria-pressed="true">모양만 (값은 가림)</button><button aria-pressed="false">값까지</button></div><p class="note">처음에는 모양만 넣어 둬요. 비밀 값으로 보이는 칸은 값까지 고르더라도 가려 둬요. 값까지 넣어 두면 이 기기를 쓰는 다른 사람도 볼 수 있어요.</p><div class="seg" role="group" aria-label="언제까지"><button aria-pressed="false">24시간</button><button aria-pressed="true">7일</button><button aria-pressed="false">계속</button></div></div><div class="acts"><a class="act" href="#">'+I('file')+'파일로 옮기기</a><a class="act" href="#" style="color:var(--warn)">전부 지우기</a></div>';
  m.querySelectorAll('.seg').forEach(function(g){g.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;g.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))})})});
},
send:function(){
  m.innerHTML='<h1>건네기</h1><p class="lede">무엇을 건넬지 먼저 골라요. 주소(링크)에는 값을 싣지 않아요.</p><div class="card"><b>'+I('shield')+' 값 없이 알려 주기 <i class="tag g" style="font-style:normal">먼저 권해요</i></b><p class="note">"3겹: Base64 → Base64 → JSON, 조심할 점 1가지"처럼 무엇이었는지만 건네요. 동료에게 물어볼 때 좋아요.</p><pre style="background:var(--bg);border-radius:10px">decod.ing으로 풀어 봤어요\n· 3겹: Base64 → Base64 → 자료(JSON)\n· 칸 4개 (order, paid, memo, api_key)\n· 조심할 점: 비밀 값으로 보이는 칸 1개\n· 값은 뺐어요</pre><div class="acts"><button class="act" style="border:0">'+I('copy')+'글로 복사</button><button class="act" style="border:0">'+I('img')+'그림 한 장</button></div></div><div class="card"><b>'+I('send')+' 풀린 값 건네기</b><p class="note">비밀 값으로 보이는 칸(api_key)은 가려서 건네요. 가리지 않으려면 한 번 더 물어봐요.</p><div class="acts"><button class="act" style="border:0">'+I('copy')+'가리고 복사</button><button class="act" style="border:0">'+I('send')+'다른 앱으로</button><button class="act" style="border:0">'+I('file')+'파일로</button></div></div><div class="card"><b>'+I('code')+' 다시 해 보는 방법 건네기</b><p class="note">받는 사람이 자기 컴퓨터에서 똑같이 풀 수 있는 명령이에요. 값은 들어 있지 않아요.</p><pre style="background:var(--bg);border-radius:10px">pbpaste | base64 -d | base64 -d | jq .</pre></div>';
},
proof:function(){
  m.innerHTML='<h1>정말 내 기기 안에서만 풀까요?</h1><p class="lede">말로만 하지 않고 지금 이 화면에서 세어 보여 드려요.</p><div class="card"><dl class="facts"><div><dt>붙여넣은 값이 밖으로 나간 횟수</dt><dd style="font-size:28px;color:var(--ok)">0번</dd></div><div><dt>이 화면을 연 뒤 지켜본 시간</dt><dd style="font-size:28px">2분 14초</dd></div></dl><p class="note">인터넷을 끊고 써 보세요. 그대로 풀려요. 가입, 광고, AI가 없어요.</p></div><div class="card"><b>왜 중요한가요</b><p class="note">2025년 11월, 줄 맞추기 사이트 두 곳에 사람들이 붙여넣고 저장한 값 8만 건 넘게가 누구나 볼 수 있게 열려 있던 일이 알려졌어요. 비밀번호와 열쇠가 섞여 있었어요. 여기는 값을 서버로 보내는 길이 아예 없어요.</p></div><div class="card"><b>세는 것 하나</b><p class="note">몇 번 열렸고 몇 번 풀었는지 횟수만 세요. 무엇을 붙여넣었는지, 누구인지는 세지 않아요. 아래에서 끌 수 있어요.</p><div class="seg" role="group" aria-label="횟수 세기"><button aria-pressed="true">횟수 세기 켬</button><button aria-pressed="false">끔</button></div></div>';
},
more:function(){
  m.innerHTML='<h1>더보기</h1><div class="card" style="padding:4px 14px">'+[['shield','내 기기 안에서만 푸는지 확인','common.html?s=proof'],['home','홈 화면에 두기 · 인터넷 없이 쓰기','#'],['paste','다른 앱에서 바로 보내기 (공유·우클릭·북마크)','#'],['type','글자 크게 · 어두운 화면','#'],['more','언어 (한국어 · English 외 6개)','#'],['mail','문의 · 못 푼 모양 알려 주기','#'],['file','개인정보 · 약관 · 푸는 방법 설명','#']].map(function(r,i,a){return '<a class="row" href="'+r[2]+'"'+(i===a.length-1?' style="border:0"':'')+'>'+I(r[0])+'<span>'+r[1]+'</span>'+I('chev')+'</a>'}).join('')+'</div>';
}};
(V[s]||V.tool)();
</script></html>
