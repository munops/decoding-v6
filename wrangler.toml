name = "decoding-v6"
compatibility_date = "2026-07-15"
workers_dev = true
preview_urls = true
routes = [
  { pattern = "decod.ing/*", zone_name = "decod.ing" },
  { pattern = "www.decod.ing/*", zone_name = "decod.ing" },
]

main = "apps/edge/src/index.ts"

[assets]
directory = "apps/web/dist"
binding = "ASSETS"
not_found_handling = "404-page"
# Worker는 이 두 경로에서만 실행된다. 나머지 자산 요청은 Worker를 거치지 않는다 —
# 정적 전달 비용과 지연을 계측 때문에 늘리지 않는다.
run_worker_first = ["/e", "/healthz"]

# aggregate-only. 이벤트 이름당 건수만 쌓이며 payload·식별자·IP는 들어가지 않는다.
[[analytics_engine_datasets]]
binding = "EVENTS"
dataset = "decoding_v6_events"

[env.staging]
name = "decoding-v6-staging"
routes = []

[env.staging.assets]
directory = "apps/web/dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/e", "/healthz"]
